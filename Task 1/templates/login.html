{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="auth-card">
    <h2>Login</h2>
    <form method="post">
        <label>Email</label>
        <input type="email" name="email" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <button class="btn primary" type="submit">Login</button>
    </form>
</section>
{% endblock %}
